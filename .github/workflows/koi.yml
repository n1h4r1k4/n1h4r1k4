name: Koi

on:
  schedule:
    # Redraw the koi just after midnight UTC, so it shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Draw the koi from my GitHub activity
        uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # git-koi draws the koi on a clear background; this puts it in a blue pond.
      - name: Put the koi in a pond
        shell: bash
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow==13.0.0
          python - koi/koi.gif koi/pond.gif <<'PY'
          import sys

          from PIL import Image, ImageChops, ImageDraw, ImageSequence

          source, target = sys.argv[1], sys.argv[2]
          water, rim = (24, 92, 140), (64, 140, 190)

          koi = Image.open(source)
          width, height = koi.size
          # Draw the pond at the koi's own pixel size (the GIF is drawn at twice it),
          # then double it so the pond's edge steps match the koi's pixels.
          pond = Image.new("RGBA", (width // 2, height // 2))
          draw = ImageDraw.Draw(pond)
          draw.rounded_rectangle((0, 0, width // 2 - 1, height // 2 - 1), radius=20, fill=rim)
          draw.rounded_rectangle((3, 3, width // 2 - 4, height // 2 - 4), radius=17, fill=water)
          pond = pond.resize((width, height), Image.Resampling.NEAREST)

          frames, durations = [], []
          for frame in ImageSequence.Iterator(koi):
              frames.append(Image.alpha_composite(pond, frame.convert("RGBA")))
              durations.append(frame.info.get("duration", 60))

          # One exact palette: entry 0 is the clear corners, then every color in use.
          colors = sorted({color[:3] for frame in frames for _, color in frame.getcolors(1 << 20) if color[3]})
          if len(colors) > 255:
              sys.exit(f"the pond koi needs {len(colors)} colors; a GIF holds 255 plus clear")
          palette = [channel for color in [(0, 0, 0), *colors] for channel in color]
          indexed = []
          for frame in frames:
              rgb, opaque = frame.convert("RGB"), frame.getchannel("A")
              frame_indexed = Image.new("P", frame.size, 0)
              for _, color in frame.getcolors(1 << 20):
                  if color[3]:
                      r, g, b = ImageChops.difference(rgb, Image.new("RGB", frame.size, color[:3])).split()
                      same = ImageChops.lighter(ImageChops.lighter(r, g), b).point(lambda v: 255 if v == 0 else 0)
                      frame_indexed.paste(colors.index(color[:3]) + 1, mask=ImageChops.multiply(same, opaque))
              frame_indexed.putpalette(palette)
              indexed.append(frame_indexed)

          indexed[0].save(
              target, save_all=True, append_images=indexed[1:], duration=durations,
              loop=0, disposal=1, transparency=0, optimize=False,
          )
          PY

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif koi/pond.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
