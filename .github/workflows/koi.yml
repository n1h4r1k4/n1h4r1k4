name: Koi

on:
  schedule:
    # Redraw the koi just after midnight UTC, so it shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/koi.yml, .github/scripts/koi_pond.py]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Draw the koi from my GitHub activity
        uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # git-koi draws the koi on a clear background; this puts it in an animated pond.
      - name: Put the koi in its pond
        shell: bash
        run: |
          python -m pip install --quiet --disable-pip-version-check numpy==2.5.4 pillow==13.0.0
          python .github/scripts/koi_pond.py koi/koi.gif koi/pond.gif

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif koi/pond.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
